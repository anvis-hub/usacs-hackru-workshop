services:
  - type: web
    name: time-until-api
    plan: free
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: time-until-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://usacs-hackru-workshop-zeta.vercel.app/
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: time-until-db
    plan: free
    databaseName: countdowns
    user: countdowns

